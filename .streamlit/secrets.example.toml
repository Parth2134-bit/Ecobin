# Copy this file to .streamlit/secrets.toml and fill in your own values.
# secrets.toml is ignored by Git. NEVER commit it or paste it into chat.

[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "PASTE-A-LONG-RANDOM-STRING"     # see README: generate with python
client_id = "PASTE-YOUR-WEB-CLIENT-ID.apps.googleusercontent.com"
client_secret = "PASTE-YOUR-CLIENT-SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

